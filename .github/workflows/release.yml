name: Release

# Pousser un tag `vX.Y.Z` construit les APK et publie une release GitHub avec.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # SDK Android préinstallé sur ubuntu-latest (licences acceptées) ; AGP télécharge le reste.
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleRelease
      - name: Rename APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk "dist/replaytv-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp app/build/outputs/apk/release/app-x86_64-release.apk "dist/replaytv-${GITHUB_REF_NAME}-x86_64.apk"
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Replay TV ${{ github.ref_name }}
          body_path: .github/RELEASE_NOTES.md
          files: dist/*.apk
