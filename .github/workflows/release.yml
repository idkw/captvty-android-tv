name: Release

# Pousser un tag `vX.Y.Z` construit les APK et publie une release GitHub avec.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # SDK Android préinstallé sur ubuntu-latest (licences acceptées) ; AGP télécharge le reste.
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare release signing
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "RELEASE_KEYSTORE_PASSWORD=${{ secrets.RELEASE_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - run: ./gradlew --no-daemon assembleRelease
      - name: Rename APKs
        run: |
          mkdir -p dist
          for abi in universal arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "dist/replaytv-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -la dist
      # Description de la release : la section de cette version dans CHANGELOG.md, puis le pied commun.
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME}"
          awk -v head="## ${version}" '
            $0 == head { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "::error::Section '## ${version}' absente ou vide dans CHANGELOG.md"
            exit 1
          fi
          cat .github/RELEASE_FOOTER.md >> dist/notes.md
          cat dist/notes.md
      # Attestation de provenance : prouve que ces APK sortent de ce workflow, dans ce dépôt
      # (vérifiable avec `gh attestation verify <apk> --owner idkw`).
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.apk
      - uses: softprops/action-gh-release@v2
        with:
          name: Replay TV ${{ github.ref_name }}
          body_path: dist/notes.md
          files: dist/*.apk
